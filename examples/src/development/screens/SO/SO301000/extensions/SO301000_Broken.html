<!-- Every in-file mistake MuiLint knows about. It has no .ts, which is fine for an extension that only moves things about. -->
<template>
  <!-- AISI0001: self-closing field -->
  <field name="UsrPriority" after="#fsColumnA-Order [name='OrderDate']"/>

  <!-- AISI0006: missing ] -->
  <field name="UsrCarrier" after="[name='CustomerID'"></field>

  <!-- AISI0009: the stock field is OrderDate -->
  <field name="UsrWeight" before="[name='OrderDat']"></field>

  <!-- AISI0005: nothing inside -->
  <qp-fieldset id="fsColumnC-AISI" after="#fsColumnB-Order" view.bind="Document"></qp-fieldset>

  <!-- AISI0012: no id, so nothing can target it -->
  <qp-grid after="#fsColumnB-Order" view.bind="Transactions"></qp-grid>

  <!-- AISI0013: config.bind is missing its closing brace -->
  <qp-grid id="grid-Extra" after="#fsColumnB-Order" view.bind="Transactions" config.bind="{ allowInsert: false"></qp-grid>

  <!-- AISI0018: a customizing tag inside another one; it has to be directly in <template>. AISI0011: no .ts declares UsrHandling -->
  <qp-fieldset id="fsColumnD-AISI" after="#fsColumnB-Order" view.bind="Document">
    <field name="UsrHandling" after="[name='OrderDate']"></field>
  </qp-fieldset>

  <!-- AISI0019: view-name is required, and the include has no colour parameter -->
  <qp-include id="inc-AISI" after="#fsColumnB-Order" url="../../../common/address.html" colour="red"></qp-include>

  <!-- AISI0024: Status is in two fieldsets of the stock screen, so this matches both -->
  <field name="UsrStage" after="[name='Status']"></field>

  <!-- AISI0023: one </field> too many -->
  <qp-fieldset id="fsColumnE-AISI" after="#fsColumnB-Order" view.bind="Document">
    <field name="UsrRoute"></field></field>
  </qp-fieldset>

  <!-- AISI0008: same id twice in one container -->
  <qp-fieldset id="fsColumnC-AISI" after="#fsColumnA-Order" view.bind="Document">
    <field name="UsrDeliveryWindow"></field>
  </qp-fieldset>
</template>
