name: Bug
description: A crash, a wrong message, something broken in the VSIX, CLI or Action.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Visual Studio extension, Command line, GitHub Action, Roslyn analyser]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or a snippet to reproduce
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: MuiLint 0.2.0, VS 17.12, Acumatica 2025 R2
