name: Release VSIX

# Publishing a release builds and attaches the VSIX. Run it by hand for a dry run: same build, same
# checks, the VSIX lands in the run's artifacts and no release is touched.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp, e.g. 0.3.0
        required: true

permissions:
  contents: write

jobs:
  pack-and-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'No version to release' }
          if (-not $v.StartsWith('v')) { $v = "v$v" }
          $plain = $v.TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "plain=$plain" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version tag=$v plain=$plain"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # The tag is the source of truth, so a v0.3.0 release can never ship a VSIX that says 0.2.0.
      - name: Stamp version
        shell: pwsh
        run: |
          $v = $env:PLAIN
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Release tags must look like v1.2.3 (VSIX versions are numeric); got '$v'" }
          function Stamp($path, $pattern, $replacement) {
            $text = Get-Content $path -Raw
            if ($text -notmatch $pattern) { throw "No version to stamp in $path" }
            Set-Content -Path $path -Value ($text -replace $pattern, $replacement) -NoNewline
          }
          Stamp 'Directory.Build.props' '<Version>[^<]*</Version>' "<Version>$v</Version>"
          Stamp 'src/AISI.MuiLint.Vsix/source.extension.vsixmanifest' '(<Identity [^>]*Version=")[^"]*' "`${1}$v"
          Stamp 'src/AISI.MuiLint.Vsix/Editor/MuiLintVsPackage.cs' '(InstalledProductRegistration\("[^"]*", "[^"]*", ")[^"]*' "`${1}$v"
        env:
          PLAIN: ${{ steps.ver.outputs.plain }}

      - name: Pack VSIX
        run: dotnet build src/AISI.MuiLint.Vsix/AISI.MuiLint.Vsix.csproj --configuration Release

      - name: Locate and rename VSIX
        id: vsix
        shell: pwsh
        run: |
          $built = @(Get-ChildItem -Path "src/AISI.MuiLint.Vsix/bin/Release" -Recurse -File -Filter *.vsix -ErrorAction Stop)
          if ($built.Count -ne 1) {
            throw "Expected exactly 1 .vsix under src/AISI.MuiLint.Vsix/bin/Release; found $($built.Count)"
          }
          $found = $built[0]
          $name = "AISI.MuiLint-$($env:PLAIN).vsix"
          $dest = Join-Path $env:GITHUB_WORKSPACE $name
          Copy-Item -LiteralPath $found.FullName -Destination $dest -Force
          "path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VSIX $($found.FullName) -> $dest"
        env:
          PLAIN: ${{ steps.ver.outputs.plain }}

      - name: Verify VSIX
        shell: pwsh
        run: .github/scripts/verify-vsix.ps1 -Path '${{ steps.vsix.outputs.path }}' -Version '${{ steps.ver.outputs.plain }}'

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.name }}
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error

      # softprops/action-gh-release v2.6.2
      - name: Attach VSIX to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
